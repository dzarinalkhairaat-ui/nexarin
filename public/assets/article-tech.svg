<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#111C33" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4F5" />
      <stop offset="100%" stop-color="#7CF2C3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgTech)" />
  <!-- Code Terminal Window -->
  <g transform="translate(250, 110)">
    <rect width="700" height="450" rx="24" fill="#0B1120" stroke="#1E293B" stroke-width="3" />
    <!-- Header -->
    <rect width="700" height="50" rx="24" fill="#0F172A" />
    <circle cx="30" cy="25" r="6" fill="#EF4444" />
    <circle cx="50" cy="25" r="6" fill="#F59E0B" />
    <circle cx="70" cy="25" r="6" fill="#10B981" />
    <text x="350" y="32" font-family="monospace" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Next.js 16 + Supabase Architecture</text>
    
    <!-- Code Lines -->
    <text x="40" y="100" font-family="monospace" font-size="16" fill="#2DD4F5">export async function <tspan fill="#7CF2C3">AppRouterServer</tspan>() {</text>
    <text x="70" y="140" font-family="monospace" font-size="16" fill="#94A3B8">const supabase = createServerClient();</text>
    <text x="70" y="180" font-family="monospace" font-size="16" fill="#F8FAFC">const { data, error } = await supabase</text>
    <text x="100" y="220" font-family="monospace" font-size="16" fill="#38BDF8">.from('articles')</text>
    <text x="100" y="260" font-family="monospace" font-size="16" fill="#38BDF8">.select('*')</text>
    <text x="100" y="300" font-family="monospace" font-size="16" fill="#38BDF8">.eq('status', 'published');</text>
    <text x="70" y="350" font-family="monospace" font-size="16" fill="#7CF2C3">return &lt;ServerComponent data={data} /&gt;;</text>
    <text x="40" y="390" font-family="monospace" font-size="16" fill="#2DD4F5">}</text>
  </g>
</svg>
